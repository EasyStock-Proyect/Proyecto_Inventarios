openapi: 3.1.0
info:
  title: Easy Stock REST API
  version: 1.0.0
  description: |
    Contrato de la API REST de Easy Stock. La API está montada bajo el prefijo
    `/api` por la aplicación Express. Las operaciones protegidas requieren un
    access token JWT en el encabezado Authorization. El refresh token se maneja
    mediante una cookie HTTP-only y no se incluye en los cuerpos JSON.
servers:
  - url: http://localhost:3000
    description: Entorno local de referencia

tags:
  - name: Autenticacion
  - name: Productos
  - name: Categorias
  - name: Ventas
  - name: Alertas
  - name: Reportes
  - name: Predicciones

paths:
  /api/auth/register:
    post:
      tags: [Autenticacion]
      summary: Registrar usuario
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            example:
              email: usuario@example.com
              password: <password>
              businessName: Mi negocio
              businessType: Tienda
      responses:
        '201':
          description: Usuario creado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
              example:
                id: 00000000-0000-0000-0000-000000000001
                email: usuario@example.com
                businessName: Mi negocio
                businessType: Tienda
                createdAt: '2026-08-27T12:00:00.000Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/auth/login:
    post:
      tags: [Autenticacion]
      summary: Iniciar sesion
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: usuario@example.com
              password: <password>
      responses:
        '200':
          description: Access token emitido. La respuesta tambien establece la cookie HTTP-only refreshToken.
          headers:
            Set-Cookie:
              description: Cookie HTTP-only de refresh token.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessTokenResponse'
              example:
                accessToken: <access-token-jwt>
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/auth/refresh:
    post:
      tags: [Autenticacion]
      summary: Renovar sesion
      operationId: refresh
      description: Lee la cookie HTTP-only refreshToken, la rota y devuelve un nuevo access token.
      parameters:
        - $ref: '#/components/parameters/RequiredRefreshCookie'
      responses:
        '200':
          description: Sesion renovada. La respuesta tambien reemplaza la cookie refreshToken.
          headers:
            Set-Cookie:
              description: Nueva cookie HTTP-only de refresh token.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessTokenResponse'
              example:
                accessToken: <access-token-jwt>
        '401':
          $ref: '#/components/responses/RefreshCookieMissing'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/auth/logout:
    post:
      tags: [Autenticacion]
      summary: Cerrar sesion
      operationId: logout
      description: Revoca el refresh token de la cookie, si existe, y limpia la cookie.
      parameters:
        - $ref: '#/components/parameters/RefreshCookie'
      responses:
        '200':
          description: Sesion cerrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                message: Sesión cerrada correctamente
        '500':
          $ref: '#/components/responses/InternalError'

  /api/auth/me:
    get:
      tags: [Autenticacion]
      summary: Obtener usuario actual
      operationId: getCurrentUser
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Usuario autenticado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
              example:
                id: 00000000-0000-0000-0000-000000000001
                email: usuario@example.com
                businessName: Mi negocio
                businessType: Tienda
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/products/generate-sku:
    get:
      tags: [Productos]
      summary: Generar SKU
      operationId: generateSku
      security:
        - bearerAuth: []
      parameters:
        - name: categoryId
          in: query
          required: true
          description: Identificador de una categoria perteneciente al usuario.
          schema:
            type: string
          example: 00000000-0000-0000-0000-000000000002
      responses:
        '200':
          description: SKU generado.
          content:
            application/json:
              schema:
                type: object
                required: [sku]
                properties:
                  sku:
                    type: string
              example:
                sku: BEB-0001
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/products:
    get:
      tags: [Productos]
      summary: Listar productos
      operationId: getProducts
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - name: limit
          in: query
          required: false
          description: Cantidad de productos por pagina. Por defecto 20.
          schema:
            type: integer
            default: 20
          example: 20
        - name: search
          in: query
          required: false
          description: Busca por nombre o SKU, sin distinguir mayusculas.
          schema:
            type: string
          example: cafe
        - name: categoryId
          in: query
          required: false
          description: Filtra por categoria.
          schema:
            type: string
          example: 00000000-0000-0000-0000-000000000002
      responses:
        '200':
          description: Productos activos y paginacion.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductPage'
              example:
                data:
                  - id: 00000000-0000-0000-0000-000000000003
                    userId: 00000000-0000-0000-0000-000000000001
                    categoryId: 00000000-0000-0000-0000-000000000002
                    name: Cafe
                    sku: BEB-0001
                    price: '12.50'
                    stockCurrent: 20
                    stockMinimum: 5
                    deletedAt: null
                    category:
                      id: 00000000-0000-0000-0000-000000000002
                      name: Bebidas
                pagination:
                  page: 1
                  limit: 20
                  total: 1
                  totalPages: 1
        '401':
          $ref: '#/components/responses/Unauthorized'
        '400':
          $ref: '#/components/responses/BadRequest'
    post:
      tags: [Productos]
      summary: Crear producto
      operationId: createProduct
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProductRequest'
            example:
              name: Cafe
              sku: BEB-0001
              categoryId: 00000000-0000-0000-0000-000000000002
              price: 12.5
              stockCurrent: 20
              stockMinimum: 5
      responses:
        '201':
          description: Producto creado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductMutationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/products/{id}:
    parameters:
      - $ref: '#/components/parameters/ProductId'
    put:
      tags: [Productos]
      summary: Actualizar producto
      operationId: updateProduct
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProductRequest'
            example:
              name: Cafe molido
              price: 13
              stockMinimum: 6
      responses:
        '200':
          description: Producto actualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductMutationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      tags: [Productos]
      summary: Eliminar producto logicamente
      operationId: deleteProduct
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Producto marcado como eliminado.
          content:
            application/json:
              schema:
                type: object
                required: [message, product]
                properties:
                  message:
                    type: string
                  product:
                    $ref: '#/components/schemas/Product'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/products/{id}/adjustments:
    parameters:
      - $ref: '#/components/parameters/ProductId'
    post:
      tags: [Productos]
      summary: Ajustar stock
      operationId: adjustStock
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StockAdjustmentRequest'
            examples:
              entry:
                value:
                  quantity: 10
                  reason: ENTRY
                  notes: Recepcion de proveedor
              correction:
                value:
                  quantity: 2
                  reason: CORRECTION
                  direction: DECREASE
                  notes: Conteo fisico
      responses:
        '201':
          description: Ajuste registrado.
          content:
            application/json:
              schema:
                type: object
                required: [message, adjustment]
                properties:
                  message:
                    type: string
                  adjustment:
                    $ref: '#/components/schemas/StockMovement'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '400':
          $ref: '#/components/responses/BadRequest'
    get:
      tags: [Productos]
      summary: Consultar ajustes de stock
      operationId: getStockAdjustments
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - name: limit
          in: query
          required: false
          description: Cantidad de movimientos por pagina. Por defecto 10.
          schema:
            type: integer
            default: 10
          example: 10
      responses:
        '200':
          description: Movimientos y paginacion.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockMovementPage'
              example:
                data:
                  - id: 00000000-0000-0000-0000-000000000004
                    productId: 00000000-0000-0000-0000-000000000003
                    userId: 00000000-0000-0000-0000-000000000001
                    quantity: 10
                    reason: ENTRY
                    notes: Recepcion de proveedor
                    createdAt: '2026-08-27T12:00:00.000Z'
                pagination:
                  page: 1
                  limit: 10
                  total: 1
                  totalPages: 1
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/categories:
    get:
      tags: [Categorias]
      summary: Listar categorias
      operationId: getCategories
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Categorias del usuario.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'
              example:
                - id: 00000000-0000-0000-0000-000000000002
                  userId: 00000000-0000-0000-0000-000000000001
                  name: Bebidas
                  productCount: 4
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Categorias]
      summary: Crear categoria
      operationId: createCategory
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryRequest'
            example:
              name: Bebidas
      responses:
        '201':
          description: Categoria creada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryMutationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/categories/{id}:
    parameters:
      - $ref: '#/components/parameters/CategoryId'
    put:
      tags: [Categorias]
      summary: Actualizar categoria
      operationId: updateCategory
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryRequest'
            example:
              name: Bebidas frias
      responses:
        '200':
          description: Categoria actualizada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryMutationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      tags: [Categorias]
      summary: Eliminar categoria
      operationId: deleteCategory
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Categoria eliminada.
          content:
            application/json:
              schema:
                type: object
                required: [message, category]
                properties:
                  message:
                    type: string
                  category:
                    $ref: '#/components/schemas/Category'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/sales:
    get:
      tags: [Ventas]
      summary: Listar ventas
      operationId: getSales
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - name: limit
          in: query
          required: false
          description: Cantidad de ventas por pagina. Por defecto 20.
          schema:
            type: integer
            default: 20
          example: 20
        - name: startDate
          in: query
          required: false
          description: Fecha inicial inclusiva en formato YYYY-MM-DD.
          schema:
            type: string
            format: date
          example: '2026-08-01'
        - name: endDate
          in: query
          required: false
          description: Fecha final inclusiva en formato YYYY-MM-DD.
          schema:
            type: string
            format: date
          example: '2026-08-27'
      responses:
        '200':
          description: Ventas y paginacion.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalePage'
              example:
                data: []
                pagination:
                  page: 1
                  limit: 20
                  total: 0
                  totalPages: 0
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Ventas]
      summary: Registrar venta
      operationId: createSale
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSaleRequest'
            example:
              items:
                - productId: 00000000-0000-0000-0000-000000000003
                  quantity: 2
                  unitPrice: 12.5
      responses:
        '201':
          description: Venta registrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SaleMutationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/alerts:
    get:
      tags: [Alertas]
      summary: Listar alertas no leidas
      operationId: getAlerts
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Alertas no leidas del usuario.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StockAlert'
              example: []
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/alerts/{id}/read:
    patch:
      tags: [Alertas]
      summary: Marcar alerta como leida
      operationId: markAlertAsRead
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AlertId'
      responses:
        '200':
          description: Alerta actualizada.
          content:
            application/json:
              schema:
                type: object
                required: [message, alert]
                properties:
                  message:
                    type: string
                  alert:
                    $ref: '#/components/schemas/StockAlert'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/reports/sales:
    get:
      tags: [Reportes]
      summary: Obtener reporte de ventas
      operationId: getSalesReport
      security:
        - bearerAuth: []
      parameters:
        - name: from
          in: query
          required: false
          description: Fecha inicial inclusiva en formato YYYY-MM-DD.
          schema:
            type: string
            format: date
          example: '2026-08-01'
        - name: to
          in: query
          required: false
          description: Fecha final inclusiva en formato YYYY-MM-DD.
          schema:
            type: string
            format: date
          example: '2026-08-27'
        - name: groupBy
          in: query
          required: false
          description: Agrupacion del reporte. Por defecto day.
          schema:
            type: string
            enum: [day, week, month]
            default: day
          example: day
      responses:
        '200':
          description: Reporte calculado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalesReport'
              example:
                totalSales: 2
                totalRevenue: 25
                topProducts:
                  - name: Cafe
                    unitsSold: 2
                    percentage: 100
                grouped:
                  - period: '2026-08-27T00:00:00.000Z'
                    totalSales: 2
                    totalRevenue: 25
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/predictions:
    get:
      tags: [Predicciones]
      summary: Obtener predicciones agregadas
      operationId: getPredictions
      description: |
        Consulta en PostgreSQL las predicciones almacenadas para los proximos
        siete dias y las agrupa por producto. Este endpoint no ejecuta Prophet
        ni Azure Functions; esos procesos generan y persisten los datos de forma
        independiente. La respuesta se almacena en una cache en memoria durante
        una hora por usuario.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Predicciones agregadas por producto.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Prediction'
              example:
                - productId: 00000000-0000-0000-0000-000000000003
                  productName: Cafe
                  forecast7d: 14
                  currentStock: 20
                  recommendedOrder: 0
                  confidence:
                    lowerBound: 10
                    upperBound: 18
                  hasEnoughData: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token JWT en el encabezado Authorization.

  parameters:
    Page:
      name: page
      in: query
      required: false
      description: Numero de pagina. El servicio usa 1 cuando no se proporciona.
      schema:
        type: integer
        default: 1
      example: 1
    ProductId:
      name: id
      in: path
      required: true
      description: Identificador del producto.
      schema:
        type: string
      example: 00000000-0000-0000-0000-000000000003
    CategoryId:
      name: id
      in: path
      required: true
      description: Identificador de la categoria.
      schema:
        type: string
      example: 00000000-0000-0000-0000-000000000002
    AlertId:
      name: id
      in: path
      required: true
      description: Identificador de la alerta.
      schema:
        type: string
      example: 00000000-0000-0000-0000-000000000005
    RefreshCookie:
      name: refreshToken
      in: cookie
      required: false
      description: Cookie HTTP-only emitida por login o refresh.
      schema:
        type: string
    RequiredRefreshCookie:
      name: refreshToken
      in: cookie
      required: true
      description: Cookie HTTP-only necesaria para renovar la sesion.
      schema:
        type: string

  responses:
    BadRequest:
      description: Solicitud invalida o regla de negocio no cumplida.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: El nombre del producto es obligatorio.
    Unauthorized:
      description: Token ausente, invalido, expirado o credenciales invalidas.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: Token expirado o inválido.
    RefreshCookieMissing:
      description: No se proporciono la cookie refreshToken.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: Sesión no encontrada
    NotFound:
      description: Recurso no encontrado.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: Usuario no encontrado.
    UnprocessableEntity:
      description: Solicitud valida pero imposible de procesar por el estado del recurso.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: El ajuste de stock no puede resultar en un stock negativo.
    InternalError:
      description: Error interno del servidor.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: Error interno del servidor.

  schemas:
    Error:
      type: object
      required: [message]
      properties:
        message:
          type: string

    MessageResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string

    RegisterRequest:
      type: object
      required: [email, password, businessName, businessType]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 8
        businessName:
          type: string
        businessType:
          type: string

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password

    AccessTokenResponse:
      type: object
      required: [accessToken]
      properties:
        accessToken:
          type: string
          description: JWT de acceso con duracion de una hora.

    User:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        businessName:
          type: string
        businessType:
          type: string
        createdAt:
          type: string
          format: date-time

    CurrentUser:
      type: object
      required: [id, email, businessName, businessType]
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        businessName:
          type: string
        businessType:
          type: string

    CategoryRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1

    Category:
      type: object
      properties:
        id:
          type: string
        userId:
          type: string
        name:
          type: string
        productCount:
          type: integer
          description: Cantidad de productos activos de la categoria.

    CategoryMutationResponse:
      type: object
      required: [message, category]
      properties:
        message:
          type: string
        category:
          $ref: '#/components/schemas/Category'

    CreateProductRequest:
      type: object
      required: [name, categoryId, price, stockCurrent, stockMinimum]
      properties:
        name:
          type: string
          minLength: 1
        sku:
          type: string
          description: Opcional; si se omite, se genera por categoria.
        categoryId:
          type: string
        price:
          type: number
          exclusiveMinimum: 0
        stockCurrent:
          type: integer
          minimum: 0
        stockMinimum:
          type: integer
          minimum: 0

    UpdateProductRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        sku:
          type: string
          minLength: 1
        categoryId:
          type: string
        price:
          type: number
        stockMinimum:
          type: integer

    Product:
      type: object
      properties:
        id:
          type: string
        userId:
          type: string
        categoryId:
          type: string
        name:
          type: string
        sku:
          type: string
        price:
          oneOf:
            - type: number
            - type: string
          description: Decimal serializado por Prisma o por la capa JSON.
        stockCurrent:
          type: integer
        stockMinimum:
          type: integer
        deletedAt:
          oneOf:
            - type: string
              format: date-time
            - type: 'null'
        category:
          $ref: '#/components/schemas/CategoryReference'

    CategoryReference:
      type: object
      properties:
        id:
          type: string
        name:
          type: string

    ProductMutationResponse:
      type: object
      required: [message, product]
      properties:
        message:
          type: string
        product:
          $ref: '#/components/schemas/Product'

    ProductPage:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Product'
        pagination:
          $ref: '#/components/schemas/Pagination'

    Pagination:
      type: object
      required: [page, limit, total, totalPages]
      properties:
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
        totalPages:
          type: integer

    StockAdjustmentRequest:
      type: object
      required: [quantity, reason]
      properties:
        quantity:
          type: integer
          minimum: 1
        reason:
          type: string
          enum: [ENTRY, DEVOLUTION, LOSS, CORRECTION]
        direction:
          type: string
          enum: [INCREASE, DECREASE]
          description: Obligatoria cuando reason es CORRECTION.
        notes:
          type:
            - string
            - 'null'

    StockMovement:
      type: object
      properties:
        id:
          type: string
        productId:
          type: string
        userId:
          type: string
        quantity:
          type: integer
          description: Positivo para entradas/incrementos y negativo para perdidas/disminuciones.
        reason:
          type: string
          enum: [ENTRY, DEVOLUTION, LOSS, CORRECTION]
        notes:
          type:
            - string
            - 'null'
        createdAt:
          type: string
          format: date-time

    StockMovementPage:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/StockMovement'
        pagination:
          $ref: '#/components/schemas/Pagination'

    CreateSaleRequest:
      type: object
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/SaleItemRequest'

    SaleItemRequest:
      type: object
      required: [productId, quantity, unitPrice]
      properties:
        productId:
          type: string
        quantity:
          type: integer
          minimum: 1
        unitPrice:
          type: number

    Sale:
      type: object
      properties:
        id:
          type: string
        userId:
          type: string
        total:
          oneOf:
            - type: number
            - type: string
        createdAt:
          type: string
          format: date-time
        items:
          type: array
          items:
            $ref: '#/components/schemas/SaleItem'

    SaleItem:
      type: object
      properties:
        id:
          type: string
        saleId:
          type: string
        productId:
          type: string
        quantity:
          type: integer
        unitPrice:
          oneOf:
            - type: number
            - type: string
        subtotal:
          oneOf:
            - type: number
            - type: string
        product:
          $ref: '#/components/schemas/ProductReference'

    ProductReference:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        sku:
          type: string

    SaleMutationResponse:
      type: object
      required: [message, sale]
      properties:
        message:
          type: string
        sale:
          $ref: '#/components/schemas/Sale'

    SalePage:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Sale'
        pagination:
          $ref: '#/components/schemas/Pagination'

    StockAlert:
      type: object
      properties:
        id:
          type: string
        productId:
          type: string
        userId:
          type: string
        stockAlert:
          type: integer
        isRead:
          type: boolean
        createdAt:
          type: string
          format: date-time
        product:
          $ref: '#/components/schemas/AlertProduct'

    AlertProduct:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        sku:
          type: string
        stockCurrent:
          type: integer
        stockMinimum:
          type: integer
        category:
          type: object
          properties:
            name:
              type: string

    SalesReport:
      type: object
      required: [totalSales, totalRevenue, topProducts, grouped]
      properties:
        totalSales:
          type: integer
        totalRevenue:
          type: number
        topProducts:
          type: array
          items:
            $ref: '#/components/schemas/TopProduct'
        grouped:
          type: array
          items:
            $ref: '#/components/schemas/GroupedSales'

    TopProduct:
      type: object
      properties:
        name:
          type: string
        unitsSold:
          type: integer
        percentage:
          type: number

    GroupedSales:
      type: object
      properties:
        period:
          type: string
          format: date-time
        totalSales:
          type: integer
        totalRevenue:
          type: number

    Prediction:
      type: object
      required:
        - productId
        - productName
        - forecast7d
        - currentStock
        - recommendedOrder
        - confidence
        - hasEnoughData
      properties:
        productId:
          type: string
        productName:
          type: string
        forecast7d:
          type: integer
          description: Demanda acumulada estimada para los proximos 7 dias.
        currentStock:
          type: integer
          description: Stock actual del producto.
        recommendedOrder:
          type: integer
          description: Cantidad sugerida considerando el stock actual y el limite superior semanal de confidence.
        confidence:
          type: object
          required: [lowerBound, upperBound]
          properties:
            lowerBound:
              type: integer
              description: Limite inferior acumulado de la demanda estimada para 7 dias.
            upperBound:
              type: integer
              description: Limite superior acumulado de la demanda estimada para 7 dias.
        hasEnoughData:
          type: boolean
          description: Indica si el modelo dispone de al menos 30 dias de historial.
