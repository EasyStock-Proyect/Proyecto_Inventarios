name: BACKEND TEST

on:
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: admin
          POSTGRES_DB: inventarios_db_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d inventarios_db_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Generar cliente Prisma
        run: npx prisma generate

      - name: Crear base de datos de pruebas
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://postgres:admin@127.0.0.1:5432/inventarios_db_test

      - name: Ejecutar pruebas
        run: npm test
        env:
          DATABASE_URL: postgresql://postgres:admin@127.0.0.1:5432/inventarios_db_test
          JWT_SECRET: inventarios_secret_2026
          JWT_REFRESH_SECRET: inventarios_refresh_secret_2026